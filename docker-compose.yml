services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aeropulse
      POSTGRES_USER: aeropulse
      POSTGRES_PASSWORD: aeropulse
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aeropulse -d aeropulse"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["sh", "-c", "npx prisma migrate deploy && npx prisma db seed"]
    environment:
      DATABASE_URL: postgresql://aeropulse:aeropulse@postgres:5432/aeropulse?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api-a:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &api-environment
      DATABASE_URL: postgresql://aeropulse:aeropulse@postgres:5432/aeropulse?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${AEROPULSE_JWT_SECRET:?Set AEROPULSE_JWT_SECRET in your shell or .env file}
      INSTANCE_ID: api-a
      PORT: 4000
      NODE_ENV: production
      LOG_FORMAT: json
      TELEMETRY_RETENTION_DAYS: 90
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  api-b:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      <<: *api-environment
      INSTANCE_ID: api-b
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/v1/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8080:8080"
    depends_on:
      api-a:
        condition: service_healthy
      api-b:
        condition: service_healthy
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8080/nginx-health | grep -q ok"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  postgres-data:
  redis-data:
