name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: aeropulse
          POSTGRES_USER: aeropulse
          POSTGRES_PASSWORD: aeropulse
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U aeropulse -d aeropulse"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: apps/api
    env:
      DATABASE_URL: postgresql://aeropulse:aeropulse@127.0.0.1:5432/aeropulse?schema=public
      JWT_SECRET: ci-only-secret-that-is-more-than-thirty-two-bytes-long
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/api/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npx prisma db seed
      - run: npm run test:ci

  web-and-compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Build web
        working-directory: apps/web
        run: |
          npm ci
          npm run lint
          npm run test:audio
          npm run test:unit
          npm run build
      - name: Install Chromium for browser tests
        working-directory: apps/web
        run: npx playwright install --with-deps chromium
      - name: Browser tests
        working-directory: apps/web
        run: npm run test:e2e
      - name: Preserve browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Validate Docker Compose
        env:
          AEROPULSE_JWT_SECRET: ci-only-secret-that-is-more-than-thirty-two-bytes-long
        run: docker compose config --quiet
